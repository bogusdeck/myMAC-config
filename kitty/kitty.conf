# ============================================================
# Kitty "Absolute" Productivity Configuration
# ============================================================

# Remote Control & Shell Integration
allow_remote_control yes
listen_on unix:/tmp/kitty
shell_integration enabled no-title

# Font Configuration
font_family      Iosevka
bold_font        Iosevka Bold
italic_font      Iosevka Italic
bold_italic_font Iosevka Bold Italic
font_size 13.0

# Performance & Latency
repaint_delay 8
input_delay 2
sync_to_monitor yes

# Terminal Browser
env TERMINAL_BROWSER_FPS=30
env TERMINAL_BROWSER_FRAMES=file


# Notifications for long-running tasks
notify_on_cmd_finish always 5.0

# Window Layout & UI

# Translucent Background
background_opacity 0.85
background_blur 80
window_padding_width 0
hide_window_decorations yes
confirm_os_window_close 0
enabled_layouts splits,stack

# Visual Feedback
visual_bell_duration 0.1
enable_audio_bell no
window_alert_on_bell yes
command_on_bell ~/.config/kitty/funny-notification.sh

# Active Window Highlighting (Essential for productivity)
active_border_color #f29718
inactive_border_color #283a46
window_border_width 1pt
draw_minimal_borders yes

# Tab Bar
tab_bar_min_tabs 2
tab_bar_edge top
tab_bar_align center
tab_bar_margin_height 0.0 1.0
tab_bar_margin_color #333333
tab_bar_style fade
tab_fade 1
tab_bar_background none
active_tab_foreground #58a6ff
active_tab_background #1e1e1e
inactive_tab_foreground #6e7681
inactive_tab_background #1e1e1e
active_tab_font_style bold
inactive_tab_font_style normal
tab_title_template "│{bell_symbol} {index}: {title} │"

# Scrollback (Huge buffer for deep history)
scrollback_lines 10000
# Scrollback search with FZF
scrollback_pager /opt/homebrew/bin/fzf --force-color --no-sort --tac --reverse --ansi --no-bold --bind 'enter:execute-silent(echo -n {2..} | pbcopy)+abort'

# ============================================================
# Theme (Managed by zsh randomizer)
# ============================================================
include current-theme.conf

# ============================================================
# "Absolute" Productivity Keybindings
# ============================================================

# --- Window Management ---
map cmd+enter launch --location=vsplit --cwd=current
map cmd+ctrl+shift+enter launch --location=hsplit --cwd=current
map cmd+w close_window
map option+tab next_window
map option+shift+tab previous_window
map ctrl+/ toggle_layout stack

# --- Scrollback & Search ---
# Open scrollback in FZF for instant searching and copying
map cmd+f show_scrollback

# --- The "Hints" Kitten (Magic) ---
# Pick a URL from the screen and open it
map cmd+p>u open_url_with_hints
# Pick a file path and open it in Windsurf
map cmd+p>f kitten hints --type path --program windsurf
# Pick a line and copy it to clipboard
map cmd+p>l kitten hints --type line --program @
# Pick a word and copy it to clipboard
map cmd+p>w kitten hints --type word --program @

# --- Tab Management ---
map cmd+t new_tab_with_cwd
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5

# --- Utils ---
map cmd+plus change_font_size all +2.0
map cmd+minus change_font_size all -2.0
map cmd+0 change_font_size all 0
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+alt+r load_config_file

# --- Mouse: Move borderless window ---
mouse_map cmd+left press ungrabbed move_window

# ============================================================
# macOS: Hide traffic lights + title bar
# (Kitty draws the title bar itself; macos_hide_titlebar
#  hides the OS title bar so the 3 traffic-light dots go away)
# ============================================================
macos_titlebar_color           background
macos_option_as_alt            yes
macos_hide_titlebar            yes
include tode/keybinds.kitty.conf

# ============================================================
# Auto-Save & Restore Session
# ============================================================
startup_session ~/.kitty-session.conf
map cmd+q launch --type=background ~/.config/kitty/save-and-quit.sh
